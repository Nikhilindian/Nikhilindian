<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 70" width="580" height="70">
  <defs>
    <linearGradient id="metallicSweep" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#AA771C"/>
      <stop offset="48%" stop-color="#FFF8D6"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="56%" stop-color="#FFF8D6"/>
      <stop offset="65%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="2.8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .text-base {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 700;
      fill: #24292F;
    }
    @media (prefers-color-scheme: dark) {
      .text-base {
        fill: #F0F6FC;
      }
    }
    .gold-shine {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: url(#metallicSweep);
      filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.45));
    }
  </style>
  <text x="50%" y="50" text-anchor="middle">
    <tspan class="text-base">Hi there, I'm </tspan>
    <tspan class="gold-shine">Nikhil</tspan>
  </text>
</svg>